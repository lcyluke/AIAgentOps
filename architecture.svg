<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" fill="#06b6d4" font-size="20" font-weight="bold">⚓ AIAgentOps — Agent Workflow Architecture</text>
  <line x1="200" y1="45" x2="760" y2="45" stroke="#334155" stroke-width="1"/>

  <!-- ====== LAYER 1: SURFACES (top) ====== -->
  <rect x="30" y="60" width="900" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="480" y="78" text-anchor="middle" fill="#94a3b8" font-size="11">SURFACES</text>

  <!-- CLI -->
  <rect x="60" y="85" width="140" height="22" rx="4" fill="#1e40af" opacity="0.8"/>
  <text x="130" y="100" text-anchor="middle" fill="#93c5fd" font-size="10">apex deploy -a agent</text>

  <!-- TUI -->
  <rect x="260" y="85" width="140" height="22" rx="4" fill="#1e40af" opacity="0.8"/>
  <text x="330" y="100" text-anchor="middle" fill="#93c5fd" font-size="10">apex tui (dashboard)</text>

  <!-- MCP -->
  <rect x="460" y="85" width="140" height="22" rx="4" fill="#1e40af" opacity="0.8"/>
  <text x="530" y="100" text-anchor="middle" fill="#93c5fd" font-size="10">apex-ops-mcp (Kiro)</text>

  <!-- API -->
  <rect x="660" y="85" width="140" height="22" rx="4" fill="#1e40af" opacity="0.8"/>
  <text x="730" y="100" text-anchor="middle" fill="#93c5fd" font-size="10">Unix socket / REST</text>

  <!-- Arrow: Surfaces → Daemon -->
  <line x1="480" y1="115" x2="480" y2="135" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ====== LAYER 2: DAEMON (middle-top) ====== -->
  <rect x="130" y="140" width="700" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="158" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">apexd Daemon (Unix socket server)</text>
  <text x="480" y="176" text-anchor="middle" fill="#64748b" font-size="9">instance registry · event bus · risk gate · stagnation guard</text>

  <!-- ====== LAYER 3: CORE ENGINES (middle) ====== -->
  <text x="480" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">CORE ENGINES</text>

  <!-- Registry -->
  <rect x="40" y="225" width="130" height="65" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="245" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">📋 Registry</text>
  <text x="105" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">name↔session_id</text>
  <text x="105" y="274" text-anchor="middle" fill="#94a3b8" font-size="8">state projection</text>
  <text x="105" y="286" text-anchor="middle" fill="#64748b" font-size="7">INV-2 · INV-4</text>

  <!-- EventBus -->
  <rect x="190" y="225" width="130" height="65" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="255" y="245" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">📡 EventBus</text>
  <text x="255" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">append-only</text>
  <text x="255" y="274" text-anchor="middle" fill="#94a3b8" font-size="8">pub/sub</text>
  <text x="255" y="286" text-anchor="middle" fill="#64748b" font-size="7">INV-4</text>

  <!-- Blackboard -->
  <rect x="340" y="225" width="130" height="65" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="405" y="245" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">🖤 Blackboard</text>
  <text x="405" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">cross-agent</text>
  <text x="405" y="274" text-anchor="middle" fill="#94a3b8" font-size="8">conclusions</text>
  <text x="405" y="286" text-anchor="middle" fill="#64748b" font-size="7">INV-3</text>

  <!-- Claims -->
  <rect x="490" y="225" width="130" height="65" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="555" y="245" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="bold">🔒 Claims</text>
  <text x="555" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">optimistic lock</text>
  <text x="555" y="274" text-anchor="middle" fill="#94a3b8" font-size="8">anti-duplicate</text>
  <text x="555" y="286" text-anchor="middle" fill="#64748b" font-size="7">task registry</text>

  <!-- Injector -->
  <rect x="640" y="225" width="130" height="65" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="705" y="245" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">💉 Injector</text>
  <text x="705" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">userPromptSubmit</text>
  <text x="705" y="274" text-anchor="middle" fill="#94a3b8" font-size="8">context digest</text>
  <text x="705" y="286" text-anchor="middle" fill="#64748b" font-size="7">per-turn inject</text>

  <!-- Auditor -->
  <rect x="790" y="225" width="130" height="65" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="855" y="245" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">✅ Auditor</text>
  <text x="855" y="260" text-anchor="middle" fill="#94a3b8" font-size="8">completion</text>
  <text x="855" y="274" text-anchor="middle" fill="#94a3b8" font-size="8">verification</text>
  <text x="855" y="286" text-anchor="middle" fill="#64748b" font-size="7">block cap 3x</text>

  <!-- ====== ARROWS: CORE INTERACTIONS ====== -->

  <!-- Daemon → Registry (spawn) -->
  <line x1="230" y1="195" x2="230" y2="222" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="210" y="212" fill="#a78bfa" font-size="7">register</text>

  <!-- Registry → EventBus -->
  <line x1="175" y1="255" x2="188" y2="255" stroke="#34d399" stroke-width="1" marker-end="url(#arrowGreen)"/>
  <text x="160" y="250" fill="#34d399" font-size="7">events</text>

  <!-- EventBus → Blackboard -->
  <line x1="320" y1="255" x2="338" y2="255" stroke="#fbbf24" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <text x="310" y="250" fill="#fbbf24" font-size="7">conclusions</text>

  <!-- Blackboard → Injector -->
  <line x1="470" y1="255" x2="488" y2="255" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <text x="460" y="250" fill="#38bdf8" font-size="7">digest</text>

  <!-- Injector → Agent context (loops back up) -->
  <path d="M705,225 C705,200 480,130 480,115" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowGreen)"/>
  <text x="590" y="170" fill="#38bdf8" font-size="7">context injection (every turn)</text>

  <!-- Auditor feedback loop -->
  <path d="M855,290 C855,310 855,340 855,340 C855,360 855,380 855,380" stroke="#f87171" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="860" y="340" fill="#f87171" font-size="7">block</text>
  <text x="860" y="355" fill="#f87171" font-size="7">→ retry</text>

  <!-- ====== LAYER 4: RUNTIMES (bottom) ====== -->
  <text x="480" y="415" text-anchor="middle" fill="#94a3b8" font-size="11">RUNTIME ADAPTERS (INV-1: single SDK boundary)</text>

  <!-- Kiro -->
  <rect x="60" y="430" width="190" height="55" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="155" y="452" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">🦊 Kiro Adapter</text>
  <text x="155" y="468" text-anchor="middle" fill="#94a3b8" font-size="8">tmux headless · ACP JSON-RPC</text>
  <text x="155" y="480" text-anchor="middle" fill="#64748b" font-size="7">spawn / prompt / steer / abort / status / dispose</text>

  <!-- Claude -->
  <rect x="280" y="430" width="190" height="55" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="375" y="452" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">🧠 Claude Code Adapter</text>
  <text x="375" y="468" text-anchor="middle" fill="#94a3b8" font-size="8">tmux · claude -p --json</text>
  <text x="375" y="480" text-anchor="middle" fill="#64748b" font-size="7">spawn / prompt / steer / abort / status / dispose</text>

  <!-- Hermes -->
  <rect x="500" y="430" width="190" height="55" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="595" y="452" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="bold">⚡ Hermes Adapter</text>
  <text x="595" y="468" text-anchor="middle" fill="#94a3b8" font-size="8">gateway REST · hermes chat -q</text>
  <text x="595" y="480" text-anchor="middle" fill="#64748b" font-size="7">spawn / prompt / steer / abort / status / dispose</text>

  <!-- ACP -->
  <rect x="720" y="430" width="190" height="55" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="815" y="452" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">🔌 ACP Client</text>
  <text x="815" y="468" text-anchor="middle" fill="#94a3b8" font-size="8">JSON-RPC over subprocess stdio</text>
  <text x="815" y="480" text-anchor="middle" fill="#64748b" font-size="7">connect / call / prompt / cancel / status</text>

  <!-- Daemon → Adapters arrow -->
  <line x1="480" y1="310" x2="480" y2="310" stroke="#3b82f6" stroke-width="2"/>
  <path d="M340,310 L340,380 L155,380 L155,428" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M480,310 L480,380 L375,380 L375,428" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M620,310 L620,380 L595,380 L595,428" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M760,310 L760,380 L815,380 L815,428" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <text x="400" y="340" fill="#22c55e" font-size="8">spawn</text>
  <text x="480" y="360" fill="#f59e0b" font-size="8">spawn</text>
  <text x="570" y="340" fill="#3b82f6" font-size="8">spawn</text>
  <text x="710" y="360" fill="#a78bfa" font-size="8">connect</text>

  <!-- ====== LAYER 5: SECURITY GATE (side) ====== -->
  <rect x="60" y="520" width="280" height="80" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="542" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">🛡 ToolRisk + StagnationGuard</text>
  <line x1="80" y1="550" x2="320" y2="550" stroke="#334155" stroke-width="1"/>
  <text x="75" y="566" fill="#22c55e" font-size="9">✅ READ_ONLY</text>
  <text x="75" y="582" fill="#f59e0b" font-size="9">⚠ STATE_CHANGING</text>
  <text x="75" y="596" fill="#ef4444" font-size="9">🚫 DESTRUCTIVE</text>
  <text x="210" y="566" fill="#94a3b8" font-size="8">auto-allow</text>
  <text x="210" y="582" fill="#94a3b8" font-size="8">configurable</text>
  <text x="210" y="596" fill="#94a3b8" font-size="8">approval required</text>

  <!-- ====== LAYER 6: STORAGE (bottom right) ====== -->
  <rect x="400" y="520" width="280" height="55" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="540" y="542" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="bold">💾 SQLite WAL (agentops.db)</text>
  <text x="540" y="558" text-anchor="middle" fill="#64748b" font-size="9">sessions · events · tasks · instances</text>
  <text x="540" y="572" text-anchor="middle" fill="#64748b" font-size="7">auto-init · thread-safe · append-only events</text>

  <!-- ====== COMPLETION FLOW (bottom) ====== -->
  <rect x="740" y="520" width="180" height="55" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="830" y="542" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">🏁 Completion</text>
  <text x="830" y="558" text-anchor="middle" fill="#94a3b8" font-size="8">Auditor.verify()</text>
  <text x="830" y="572" text-anchor="middle" fill="#94a3b8" font-size="8">pass → stop | fail → block → retry</text>

  <!-- Adapters → Completion arrow -->
  <path d="M155,488 L155,540 L155,540" stroke="#22c55e" stroke-width="1.5" fill="none"/>
  <path d="M375,488 L375,540 L738,540" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- ====== COST PANEL (top right) ====== -->
  <rect x="820" y="60" width="110" height="55" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="875" y="78" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">💰 Cost</text>
  <text x="875" y="94" text-anchor="middle" fill="#94a3b8" font-size="8">$1/M in</text>
  <text x="875" y="108" text-anchor="middle" fill="#94a3b8" font-size="8">$4/M out</text>

  <!-- ====== LEGEND (bottom) ====== -->
  <rect x="60" y="630" width="840" height="70" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="650" text-anchor="middle" fill="#94a3b8" font-size="9">Agent Lifecycle: spawn → inject context → execute → audit → pass? stop : block → retry</text>
  <text x="480" y="668" text-anchor="middle" fill="#64748b" font-size="8">Cross-agent: blackboard share · claims lock · injector feed | Security: 3-tier gate · role whitelist · stagnation detection</text>
  <text x="480" y="686" text-anchor="middle" fill="#64748b" font-size="8">INV-1 single SDK boundary · INV-2 name↔session · INV-3 blackboard single-writer · INV-4 events append-only · INV-5 secrets redacted</text>
</svg>
